<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121212">
<title>Листы персонажей</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    background: #0d0d12;
    color: #d1d1d1;
    font-family: 'Segoe UI', 'Roboto', sans-serif;
  }

  h1 {
    margin: 0;
    font-size: 0.8rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #666;
    font-weight: bold;
  }

  .sheets {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    width: 100%;
    max-width: 640px;
  }

  .sheet {
    flex: 1 1 240px;
    max-width: 300px;
    text-decoration: none;
    padding: 28px 24px;
    border-radius: 10px;
    border: 1px solid;
    transition: transform 0.2s, box-shadow 0.2s;
    display: block;
  }

  .sheet:hover { transform: translateY(-3px); }

  .sheet-icon { font-size: 2rem; display: block; margin-bottom: 12px; }
  .sheet-name { font-size: 1.3rem; font-weight: bold; display: block; }
  .sheet-role { font-size: 0.8rem; opacity: 0.7; display: block; margin-top: 4px; }

  .stivi {
    background: #1a1a1a;
    border-color: #b87333;
    color: #e2a76f;
    font-family: 'Segoe UI', 'Roboto', sans-serif;
  }
  .stivi:hover { box-shadow: 0 8px 24px rgba(184, 115, 51, 0.35); }

  .oniks {
    background: #1a0f2b;
    border-color: #a855f7;
    color: #d8b4fe;
    font-family: 'Georgia', serif;
  }
  .oniks:hover { box-shadow: 0 8px 24px rgba(168, 85, 247, 0.35); }
</style>
</head>
<body>

<h1>Листы персонажей</h1>

<div class="sheets">
  <a class="sheet stivi" href="stivi/main.html">
    <span class="sheet-icon">⚒️</span>
    <span class="sheet-name">Стиви</span>
    <span class="sheet-role">Артифайсер · мастерская</span>
  </a>

  <a class="sheet oniks" href="oniks/main.html">
    <span class="sheet-icon">🌙</span>
    <span class="sheet-name">Оникс</span>
    <span class="sheet-role">Друид · фолиант</span>
  </a>
</div>

</body>
</html>
