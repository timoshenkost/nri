<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1a1a">
<title>Гомункул</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../common/common.css">
<link rel="stylesheet" href="../common/creature.css">

<script src="character.js"></script>
<script src="../common/common.js"></script>
<script src="schemes.js"></script>
<script src="homunculus.js"></script>
<script src="../common/render_creature.js"></script>

<style>
  /* Шапка со счётчиками. Такая же полоса, как в книге заклинаний, но
     spellbook.css сюда тянуть не за чем — там всё остальное про заклинания. */
  .panel {
    background: var(--inset);
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }

  /* .resource-controls раздвигает содержимое по краям — счётчику ресурса
     так и надо, а здесь кнопки должны стоять кучкой. */
  .level-row,
  .hp-controls { justify-content: center; }

  .level-row { gap: 6px; }

  .level-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    border-color: var(--border-strong);
    color: var(--text);
  }

  .level-btn.is-current {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-light);
    font-weight: bold;
  }

  /* Хиты устроены как в шапке персонажа: по числу щёлкаешь и вводишь урон,
     лечение или временные, а максимум не трогаешь — он считается из круга
     заклинания и улучшений. */
  .hp-controls { gap: 4px; }

  .hp-current,
  .hp-max {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    font-weight: bold;
  }

  .hp-current {
    background: none;
    border: none;
    padding: 0 2px;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .hp-max { color: var(--gold); }
  .hp-divider { opacity: 0.5; }

  .hp-temp {
    background: none;
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    color: var(--gold);
    font-size: 0.75rem;
    font-weight: bold;
    padding: 1px 5px;
    margin-right: 4px;
    cursor: pointer;
  }

  .hp-full {
    width: 24px;
    height: 24px;
    padding: 0;
    margin-left: 4px;
    border-color: var(--accent);
    color: var(--hp-red);
  }

  .upgrade {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    margin-bottom: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .upgrade.is-on {
    border-color: var(--accent-light);
    background: var(--card-open);
  }

  .upgrade input { margin-top: 3px; accent-color: var(--accent); }
  .upgrade-body { min-width: 0; }
  .upgrade-name { color: var(--accent-light); font-weight: bold; }
  .upgrade.is-on .upgrade-name { color: var(--gold); }

  .upgrade-line {
    display: block;
    font-size: 0.85rem;
    margin-top: 5px;
    opacity: 0.85;
  }

  .upgrade-line b { color: var(--muted); }
  .upgrade.is-on .upgrade-line { opacity: 1; }
  .upgrade.is-on .upgrade-line b { color: var(--accent-light); }
</style>
</head>
<body>

<header>
  <h1>🤖 Гомункул</h1>
</header>

<section class="panel">
  <div class="resource-row" id="panel"></div>
</section>

<main>
  <div id="card"></div>

  <div class="section-header">Улучшения</div>
  <div id="upgrades"></div>
</main>

<script>
/* Заклинание второго круга, ниже его не наложить. Список кругов растёт сам
   вместе с ячейками в character.js — руками сюда лазить не придётся. */
const LEVELS = Object.keys(CHARACTER.slots || {})
  .map(Number)
  .filter(level => level >= 2)
  .sort((a, b) => a - b);
if (!LEVELS.length) LEVELS.push(2);

/* Улучшения берём из «Схем», чтобы название и эффект жили в одном месте.
   Опознаём по наличию поля homunculus, а не по строке type: тип написан
   для человека и вполне может поменяться. */
const UPGRADES = Object.values(initialRecipes)
  .reduce((all, group) => all.concat(group), [])
  .filter(recipe => recipe.homunculus);

/* Галочка «стоит на гомункуле» — состояние только этой страницы. Из «Схем»
   его не вывести: там done значит «рецепт известен», а набранные очки
   работы — «сделан один экземпляр», и то и другое сбрасывается отдельно. */
const LEVEL_KEY = 'homunculus_level';
const MODS_KEY = 'homunculus_mods';
const HP_KEY = 'homunculus_hp';
const TEMP_KEY = 'homunculus_temp_hp';

function readNumber(key, fallback) {
  const value = Number(Store.get(key, fallback));
  return Number.isFinite(value) ? value : fallback;
}

let level = readNumber(LEVEL_KEY, LEVELS[0]);
if (!LEVELS.includes(level)) level = LEVELS[0];

let installed = Store.get(MODS_KEY, []);
if (!Array.isArray(installed)) installed = [];

const panel = document.getElementById('panel');
const card = document.getElementById('card');
const upgradeList = document.getElementById('upgrades');

function mods() {
  return UPGRADES
    .filter(upgrade => installed.includes(upgrade.id))
    .map(upgrade => upgrade.homunculus);
}

function sum(key) {
  return mods().reduce((total, mod) => total + (Number(mod[key]) || 0), 0);
}

function maxHP() {
  return homunculusHP(level) + sum('hp');
}

let hp = Math.max(0, readNumber(HP_KEY, maxHP()));
/* Временные хиты живут отдельно: максимумом не ограничены, тратятся
   первыми и лечением не восстанавливаются — как у персонажа. */
let tempHP = Math.max(0, readNumber(TEMP_KEY, 0));

// Круг заклинания записан в данных как {ур} — подставляем число.
function fill(text) {
  return String(text).replace(/\{ур\}/g, level);
}

function creature() {
  const extra = key => mods().reduce((all, mod) => all.concat(mod[key] || []), []);
  const withLevel = list => list.map(item => ({ name: item.name, desc: fill(item.desc) }));

  return Object.assign({}, homunculusBase, {
    ac: String(homunculusBase.ac + sum('ac')),
    hp: `${maxHP()} (Кости хитов ${level}к4)`,
    resistances: mods().map(mod => mod.resistances).filter(Boolean).join(', '),
    traits: withLevel(homunculusBase.traits.concat(extra('traits'))),
    actions: withLevel(homunculusBase.actions.concat(extra('actions'))),
    reactions: withLevel(homunculusBase.reactions)
  });
}

/* Что улучшение делает — построчно и той же формулировкой, что попадёт в
   блок статистики. Берём из самой прибавки, а не из строки effect в
   «Схемах»: та написана коротко, для сборки, и говорила бы «+2 КД» там,
   где в блоке стоит КЗ. */
function changes(upgrade) {
  const mod = upgrade.homunculus;
  const lines = [];
  if (mod.ac) lines.push(['Класс Защиты', `+${mod.ac}`]);
  if (mod.hp) lines.push(['Хиты', `+${mod.hp}`]);
  if (mod.resistances) lines.push(['Сопротивление урону', mod.resistances]);
  (mod.traits || []).forEach(trait => {
    lines.push([`Особенность «${trait.name}»`, fill(trait.desc)]);
  });
  (mod.actions || []).forEach(action => {
    lines.push([`Действие «${action.name}»`, fill(action.desc)]);
  });
  return lines;
}

function hpColor(share) {
  if (share >= 1) return 'var(--hp-green)';
  if (share > 0.5) return 'var(--text)';
  if (share > 0.25) return 'var(--gold)';
  return 'var(--hp-red)';
}

function render() {
  const max = maxHP();
  hp = Math.max(0, Math.min(hp, max));
  Store.set(HP_KEY, hp);
  Store.set(TEMP_KEY, tempHP);

  panel.innerHTML = `
    <div class="resource-item">
      <span class="resource-name">Круг заклинания</span>
      <div class="resource-controls level-row">
        ${LEVELS.map(value => `
          <button class="btn-base level-btn ${value === level ? 'is-current' : ''}"
                  type="button" data-level="${value}"
                  aria-label="Наложить ${value} кругом">${value}</button>
        `).join('')}
      </div>
    </div>

    <div class="resource-item ${hp === 0 ? 'is-empty' : ''}">
      <span class="resource-name">Хиты</span>
      <div class="resource-controls hp-controls">
        <button class="hp-temp" id="hp-temp" type="button" ${tempHP ? '' : 'hidden'}
                title="Временные хиты — тратятся первыми"
                aria-label="Временные хиты">+${tempHP}</button>
        <button class="hp-current" id="hp-current" type="button"
                style="color: ${hpColor(max > 0 ? hp / max : 0)}"
                title="Ввести урон, лечение или временные хиты"
                aria-label="Ввести урон или лечение">${hp}</button>
        <span class="hp-divider">/</span>
        <span class="hp-max">${max}</span>
        <button class="btn-base hp-full" id="hp-full" type="button"
                title="Свежий гомункул: хиты под завязку"
                aria-label="Восстановить все хиты">❤</button>
      </div>
    </div>
  `;

  card.innerHTML = `
    <details class="creature" open>
      <summary>
        <span>${esc(homunculusBase.name)} <span class="size">${esc(homunculusBase.size)}</span></span>
      </summary>
      ${renderCreatureBody(creature())}
    </details>
  `;

  upgradeList.innerHTML = UPGRADES.map(upgrade => {
    const on = installed.includes(upgrade.id);
    return `
      <label class="upgrade ${on ? 'is-on' : ''}">
        <input type="checkbox" data-upgrade="${esc(upgrade.id)}" ${on ? 'checked' : ''}>
        <span class="upgrade-body">
          <span class="upgrade-name">${esc(upgrade.name)}</span>
          ${changes(upgrade).map(([label, text]) => `
            <span class="upgrade-line"><b>${esc(label)}:</b> ${esc(text)}</span>
          `).join('')}
        </span>
      </label>
    `;
  }).join('');
}

/* Полные хиты остаются полными: подняли круг или воткнули имплант — запас
   вырос целиком, а не оставил гомункула раненым на ровном месте. */
function keepFull(change) {
  const wasFull = hp >= maxHP();
  change();
  if (wasFull) hp = maxHP();
  render();
}

function amountOf(raw) {
  const amount = Math.abs(parseInt(raw, 10));
  return Number.isFinite(amount) && amount > 0 ? amount : 0;
}

// Урон сначала съедает временные хиты, лечение их не возвращает.
function damage(amount) {
  const absorbed = Math.min(tempHP, amount);
  tempHP -= absorbed;
  hp = Math.max(0, hp - (amount - absorbed));
  render();
}

function heal(amount) {
  hp = Math.min(hp + amount, maxHP());
  render();
}

// Временные хиты не складываются: остаётся тот запас, что больше.
function setTemp(value, keepHigher) {
  const parsed = Math.max(0, parseInt(value, 10) || 0);
  if (keepHigher && parsed <= tempHP) {
    if (parsed > 0) showNotice(`Прежний запас больше — оставлено ${tempHP}`);
    return;
  }
  tempHP = parsed;
  render();
}

document.addEventListener('click', event => {
  if (event.target.closest('#hp-current')) {
    Modal.prompt({
      title: 'Урон или лечение',
      text: tempHP > 0
        ? `Сейчас ${hp} (+${tempHP}) / ${maxHP()}`
        : `Сейчас ${hp} / ${maxHP()}`,
      value: '',
      actions: [
        { label: 'Урон', className: 'btn-confirm', onClick: v => { const n = amountOf(v); if (n) damage(n); } },
        { label: 'Лечение', className: 'btn-cancel', onClick: v => { const n = amountOf(v); if (n) heal(n); } },
        { label: 'Временные', className: 'btn-cancel', onClick: v => { const n = amountOf(v); if (n) setTemp(n, true); } }
      ]
    });
    return;
  }

  if (event.target.closest('#hp-temp')) {
    Modal.prompt({
      title: 'Временные хиты',
      text: 'Точное значение запаса. 0 — снять.',
      value: tempHP,
      onConfirm: value => setTemp(value, false)
    });
    return;
  }

  if (event.target.closest('#hp-full')) {
    hp = maxHP();
    render();
    return;
  }

  const levelBtn = event.target.closest('[data-level]');
  if (levelBtn) {
    keepFull(() => {
      level = Number(levelBtn.dataset.level);
      Store.set(LEVEL_KEY, level);
    });
  }
});

document.addEventListener('change', event => {
  const box = event.target.closest('[data-upgrade]');
  if (!box) return;

  const id = box.dataset.upgrade;
  keepFull(() => {
    installed = box.checked
      ? installed.concat([id])
      : installed.filter(other => other !== id);
    Store.set(MODS_KEY, installed);
  });
  showNotice(box.checked ? 'Улучшение установлено' : 'Улучшение снято');
});

render();
</script>

</body>
</html>
