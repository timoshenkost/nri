<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1a1a">
<title>Инструменты</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../common/common.css">

<script src="character.js"></script>
<script src="../common/common.js"></script>
<script src="tools.js"></script>

<style>
  .tool-stat { margin-bottom: 15px; }

  .craft {
    margin-top: 12px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
</style>
</head>
<body>

<header>
  <h1>⚒️ Инструменты</h1>
</header>

<main>
  <input id="search" class="search-input" type="search"
         placeholder="Поиск по названию, действию или изделию…"
         aria-label="Поиск по инструментам">

  <div id="app"></div>
  <p class="search-empty" hidden>Ничего не найдено.</p>
</main>

<script>
const app = document.getElementById("app");

function renderTool(tool, category) {
  const haystack = [
    tool.name,
    tool.stat,
    tool.craft,
    ...tool.actions.map(a => a[0])
  ].join(" ").toLowerCase();

  return `
    <details class="tool" data-key="${esc(category + "|" + tool.name)}" data-search="${esc(haystack)}">
      <summary>${esc(tool.name)}</summary>
      <div class="content">
        ${tool.stat ? `<div class="tool-stat"><span class="label">Характеристика</span> ${esc(tool.stat)}</div>` : ""}

        <table>
          <thead>
            <tr>
              <th>Действие</th>
              <th style="text-align: right;">Сложность</th>
            </tr>
          </thead>
          <tbody>
            ${tool.actions.map(a => `
              <tr>
                <td>${esc(a[0])}</td>
                <td class="dc-value">${esc(a[1])}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${tool.craft ? `<div class="craft"><span class="label">Изготовление</span> ${esc(tool.craft)}</div>` : ""}
      </div>
    </details>
  `;
}

app.innerHTML = groupByTags(initialTools.filter(tool => !tool.hidden), toolCategories).map(([category, tools]) => `
  <div class="group">
    <div class="section-header">${esc(category)}</div>
    ${tools.map(tool => renderTool(tool, category)).join("")}
  </div>
`).join("");

initSearch(document.getElementById("search"), document.querySelector("main"));
</script>

</body>
</html>
